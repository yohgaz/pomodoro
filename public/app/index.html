<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pomodoro</title>
    <meta name="theme-color" content="#0B0D14">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/editor.css">
    <link rel="stylesheet" href="/app/app.css">
    <link rel="stylesheet" href="/app/db-calendar.css">
    <script>
        try { const t = localStorage.getItem('pomodoro.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
</head>
<body>
    <div id="app" class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <section class="list-pane" id="listPane"></section>
        <main class="editor-pane" id="editorPane"></main>
        <section class="wide-pane" id="widePane" hidden></section>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="/app/js/main.js"></script>
</body>
</html>
