<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Pomodoro — overlay tâches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <style>
        html, body { margin: 0; background: transparent; overflow: hidden; }
        body { font-family: var(--font); color: var(--tx); padding: 20px; -webkit-font-smoothing: antialiased; }
        .board {
            --fs: 19px;
            --acc: #F0653D;
            width: 560px; font-size: var(--fs);
            background: rgba(17, 19, 27, var(--bg-op, .9));
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 1.2em;
            box-shadow: 0 1.2em 3em rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
            overflow: hidden; position: relative;
            transition: opacity .6s ease, transform .6s ease;
            backdrop-filter: blur(24px) saturate(150%);
        }
        .board::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--acc), #E8B84D, #6FDA9A); }
        .board.is-hidden { opacity: 0; transform: translateY(-12px) scale(.98); }
        .head { display: flex; align-items: center; gap: .7em; padding: 1em 1.15em .8em; }
        .head svg { width: 2.1em; height: 2.1em; flex-shrink: 0; filter: drop-shadow(0 4px 10px rgba(240, 101, 61, .35)); }
        .titles { flex: 1; min-width: 0; }
        .title { font-weight: 900; font-size: 1.15em; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .subtitle { font-size: .72em; font-weight: 700; color: var(--mu); margin-top: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .subtitle b { color: var(--acc); font-weight: 900; }
        .counter { text-align: right; }
        .counter .num { font-size: 1.35em; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
        .counter .num span { color: var(--mu); font-size: .7em; }
        .counter .lbl { font-size: .58em; letter-spacing: .14em; text-transform: uppercase; color: var(--mu); font-weight: 900; margin-top: .25em; }
        .bar { height: .32em; margin: 0 1.15em .9em; border-radius: 1em; background: rgba(255, 255, 255, .07); overflow: hidden; }
        .bar i { display: block; height: 100%; border-radius: 1em; background: linear-gradient(90deg, var(--acc), #E8B84D); transition: width .8s cubic-bezier(.3, 1.3, .5, 1); }
        .viewport { position: relative; overflow: hidden; }
        .viewport.is-scrolling { -webkit-mask-image: linear-gradient(transparent, #000 1.2em, #000 calc(100% - 1.6em), transparent); mask-image: linear-gradient(transparent, #000 1.2em, #000 calc(100% - 1.6em), transparent); }
        .track { will-change: transform; }
        .list { padding: .15em .8em .5em; display: flex; flex-direction: column; gap: .55em; }
        .gap { height: 1.4em; }
        .user.is-new { animation: in .5s cubic-bezier(.3, 1.3, .5, 1) both; }
        .user {
            background: rgba(255, 255, 255, .035); border: 1px solid rgba(255, 255, 255, .05);
            border-radius: .85em; padding: .6em .75em .65em;
        }
        .user.is-host { background: linear-gradient(135deg, rgba(232, 184, 77, .10), rgba(232, 184, 77, .02)); border-color: rgba(232, 184, 77, .22); }
        @keyframes in { from { opacity: 0; transform: translateX(1em); } }
        .uhead { display: flex; align-items: center; gap: .45em; margin-bottom: .3em; }
        .uname { font-weight: 900; font-size: .9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { font-size: .56em; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; padding: .2em .55em; border-radius: 1em; background: rgba(232, 184, 77, .16); color: #E8B84D; flex-shrink: 0; }
        .proj { font-size: .62em; font-weight: 800; padding: .2em .6em; border-radius: 1em; background: rgba(255, 255, 255, .07); color: var(--tx-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
        .spacer { flex: 1; }
        .pomo { display: flex; align-items: center; gap: .35em; font-size: .72em; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--acc); flex-shrink: 0; }
        .pomo.is-break { color: #6FDA9A; }
        .pomo.is-paused { color: var(--mu); }
        .pomo svg { width: 1.35em; height: 1.35em; transform: rotate(-90deg); }
        .task { display: flex; gap: .55em; align-items: flex-start; font-weight: 800; line-height: 1.35; padding: .12em 0; font-size: .92em; }
        .task .ico { width: 1.05em; flex-shrink: 0; text-align: center; margin-top: .05em; }
        .task.done { color: rgba(244, 242, 237, .38); }
        .task.done .txt { text-decoration: line-through; text-decoration-color: rgba(111, 218, 154, .5); text-decoration-thickness: .08em; }
        .task.done .ico { color: #6FDA9A; }
        .task.just-done { animation: flash 1.6s ease-out; }
        @keyframes flash { 0% { color: #6FDA9A; transform: scale(1.03); } 100% { } }
        .task.active .txt { color: #fff; }
        .task.active .ico { display: grid; place-items: center; height: 1.35em; }
        .task.active .ico i { width: .55em; height: .55em; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 0 var(--acc); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--acc) 70%, transparent); } 70% { box-shadow: 0 0 0 .45em transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.task.next { color: rgba(244, 242, 237, .62); font-weight: 700; font-size: .84em; }
        .task.next .ico { color: rgba(244, 242, 237, .35); font-size: .8em; margin-top: .15em; }
        .more { font-size: .66em; font-weight: 800; color: var(--mu); margin-top: .2em; padding-left: 2.05em; }
        .empty { padding: 1.4em 1.2em 1.6em; text-align: center; color: var(--mu); font-weight: 800; font-size: .85em; line-height: 1.5; }
        .empty b { color: var(--acc); }
        .sparkle { position: fixed; pointer-events: none; font-size: 1.2em; animation: sparkle 1.2s ease-out forwards; }
        @keyframes sparkle { to { transform: translateY(-2em) scale(1.4); opacity: 0; } }
    </style>
</head>
<body>
    <div class="board" id="board">
        <div class="head" id="head">
            <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A5C"/><stop offset="1" stop-color="#E24A22"/></linearGradient></defs><circle cx="32" cy="36" r="23" fill="url(#tg)"/><path d="M32 14c-3 0-6 1.5-8 4 3 0 5 .5 6.5 2-3 .5-6 2.5-7.5 5 3.5-1 7-1 9 0 2-1 5.5-1 9 0-1.5-2.5-4.5-4.5-7.5-5 1.5-1.5 3.5-2 6.5-2-2-2.5-5-4-8-4Z" fill="#6FDA9A"/><path d="M32 8v8" stroke="#6FDA9A" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="23" cy="33" rx="4" ry="6" fill="#fff" opacity=".22" transform="rotate(25 23 33)"/></svg>
            <div class="titles"><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div>
            <div class="counter"><div class="num" id="count"></div><div class="lbl">faites</div></div>
        </div>
        <div class="bar" id="bar"><i id="barFill"></i></div>
        <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
    </div>
    <script type="module">
        import { connect, params, esc, fmt, remaining, readable, isPreview } from '/overlay/overlay.js';

        const onlyUser = (params.get('user') || '').toLowerCase();
        const $ = id => document.getElementById(id);
        let snap = null;
        let prevDone = new Set();
        let knownUsers = new Set();
        let firstRender = true;

        const DEMO = () => {
            const now = Date.now();
            return [
                { login: 'demo_hote', name: 'Emilae_TV', color: '#F0653D', isStreamer: true, project: 'Overlay', active: { text: 'Finir la scène de début de live' }, next: [{ id: 'n1', text: 'Tester le minuteur' }, { id: 'n2', text: 'Répondre aux messages' }], done: [{ id: 'd1', text: 'Préparer le planning de la semaine' }], backlogCount: 1, pomo: { phase: 'work', endsAt: now + 17 * 60000, phaseDuration: 25 * 60000, paused: false, completed: 1, goal: 4 } },
                { login: 'demo_a', name: 'Lunelle', color: '#9146FF', active: { text: 'Réviser le chapitre 4 de physique' }, done: [{ id: 'd2', text: 'Fiche de vocabulaire' }, { id: 'd3', text: 'Ranger le bureau' }], backlogCount: 0, pomo: { phase: 'break', endsAt: now + 3 * 60000, phaseDuration: 5 * 60000, paused: false, completed: 2, goal: 4 } },
                { login: 'demo_b', name: 'PixelCafé', color: '#1E90FF', active: { text: 'Dessiner les croquis du perso' }, done: [], backlogCount: 2, pomo: null },
                { login: 'demo_c', name: 'Tom_Codes', color: '#008000', active: null, done: [{ id: 'd4', text: 'Corriger le bug du menu' }], backlogCount: 0, pomo: null }
            ];
        };

        function pomoHtml(p) {
            if (!p || p.phase === 'done') return p && p.phase === 'done' ? '<span class="pomo is-break">✓ pomo fini</span>' : '';
            const rem = remaining(p);
            const frac = Math.max(0, Math.min(1, 1 - rem / (p.phaseDuration || 1)));
            const c = 2 * Math.PI * 9;
            const cls = p.paused ? 'is-paused' : p.phase === 'break' ? 'is-break' : '';
            return `<span class="pomo ${cls}" data-pomo><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="3"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}"/></svg><span data-time>${p.paused ? '⏸ ' : ''}${fmt(rem)}</span></span>`;
        }

        function userHtml(u, o) {
            const color = o.useTwitchColors ? readable(u.color) : readable(u.color && u.isStreamer ? u.color : '#F4F2ED');
            const done = o.showDone ? u.done.map(t => `<div class="task done ${prevDone.has(t.id) || firstRender ? '' : 'just-done'}"><span class="ico">✓</span><span class="txt">${esc(t.text)}</span></div>`).join('') : '';
            const active = u.active ? `<div class="task active"><span class="ico"><i></i></span><span class="txt">${esc(u.active.text)}</span></div>` : '';
            const next = (u.next || []).map(t => `<div class="task next"><span class="ico">○</span><span class="txt">${esc(t.text)}</span></div>`).join('');
            const more = o.showBacklogCount && u.backlogCount ? `<div class="more">+ ${u.backlogCount} en attente</div>` : '';
            return `<div class="user ${u.isStreamer ? 'is-host' : ''} ${knownUsers.has(u.login) || firstRender ? '' : 'is-new'}" data-login="${esc(u.login)}">
                <div class="uhead"><span class="uname" style="color:${color}">${esc(u.name)}</span>${u.isStreamer ? '<span class="badge">hôte</span>' : ''}${o.showProject && u.project ? `<span class="proj">📁 ${esc(u.project)}</span>` : ''}<span class="spacer"></span>${o.showPomo ? pomoHtml(u.pomo) : ''}</div>
                ${done}${active}${next}${more}</div>`;
        }

        function render() {
            if (!snap) return;
            const o = snap.overlay;
            const board = $('board');
            board.style.width = o.width + 'px';
            board.style.setProperty('--fs', o.fontSize + 'px');
            board.style.setProperty('--acc', o.accent);
            board.style.setProperty('--bg-op', o.bgOpacity);
            board.classList.toggle('is-hidden', !!snap.hidden && !isPreview);
            $('head').style.display = o.showHeader ? '' : 'none';
            $('bar').style.display = o.showHeader ? '' : 'none';
            let users = snap.users;
            if (onlyUser) users = users.filter(u => u.login === onlyUser);
            const demo = isPreview && !users.length;
            if (demo) users = DEMO();
            const done = demo ? 5 : snap.totals.done;
            const total = demo ? 8 : snap.totals.total;
            $('title').textContent = o.title;
            $('subtitle').innerHTML = esc(o.subtitle).replace(/(![\w]+)/g, '<b>$1</b>');
            $('count').innerHTML = `${done}<span>/${total}</span>`;
            $('barFill').style.width = total ? `${Math.round(done * 100 / total)}%` : '0%';

            const list = users.length
                ? `<div class="list">${users.map(u => userHtml(u, o)).join('')}</div>`
                : `<div class="empty">Personne n’a encore de tâche.<br>Écris <b>!task</b> + ta tâche dans le chat ✍️</div>`;
            const newDone = new Set(users.flatMap(u => u.done.map(t => t.id)));
            prevDone = newDone;
            knownUsers = new Set(users.map(u => u.login));
            renderedUsers = users;
            firstRender = false;
            buildTrack(list, o);
        }

        // Défilement continu en boucle quand la liste dépasse la hauteur max.
        let renderedUsers = [];
        let scrollY = 0, loopH = 0, lastT = 0, speed = 38, trackHtml = '';
        function buildTrack(listHtml, o) {
            const vp = $('viewport'), track = $('track');
            speed = o.scrollSpeed || 38;
            track.innerHTML = listHtml;
            const h = track.scrollHeight;
            if (h > o.maxHeight) {
                vp.style.height = o.maxHeight + 'px';
                vp.classList.add('is-scrolling');
                track.innerHTML = listHtml + '<div class="gap"></div>' + listHtml;
                loopH = track.children[0].offsetHeight + track.children[1].offsetHeight;
                scrollY = scrollY % loopH;
            } else {
                vp.style.height = '';
                vp.classList.remove('is-scrolling');
                loopH = 0; scrollY = 0;
                track.style.transform = '';
            }
        }
        function frame(t) {
            const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0;
            lastT = t;
            if (loopH) {
                scrollY = (scrollY + speed * dt) % loopH;
                $('track').style.transform = `translateY(${-scrollY}px)`;
            }
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        // Mise à jour des minuteurs individuels chaque seconde, sans tout redessiner.
        setInterval(() => {
            for (const u of renderedUsers) {
                if (!u.pomo || u.pomo.phase === 'done' || u.pomo.paused) continue;
                const html = pomoHtml(u.pomo);
                document.querySelectorAll(`.user[data-login="${CSS.escape(u.login)}"] [data-pomo]`).forEach(el => { el.outerHTML = html; });
            }
        }, 1000);

        connect(s => { snap = s; render(); });
    </script>
</body>
</html>
